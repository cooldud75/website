<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Halving Schedule</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #334155;
            --heading-color: #0f172a;
            --accent-color: #2563eb;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .site-header {
            background: white;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }

        .site-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--heading-color);
            text-decoration: none;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .site-main {
            flex: 1;
            padding: 3rem 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-top: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        h1, h2, h3 {
            color: var(--heading-color);
            margin-top: 0;
        }

        .site-footer {
            text-align: center;
            padding: 1.5rem 0;
            font-size: 0.875rem;
            color: #64748b;
            border-top: 1px solid var(--border-color);
            background: white;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="logo">Agosta.net</a>
            <nav>
                <a href="/">Home</a>
                <a href="/bitcoin/" style="margin-left: 15px;">Bitcoin</a>
            </nav>
        </div>
    </header>

    <main class="site-main container">
        
<style>
  /* Force the layout container to expand for this specific page */
  main, .container, .wrapper {
    max-width: 95% !important;
    width: 100% !important;
  }
</style>

<h1>Bitcoin Halving Schedule</h1>

    </main>

    <footer class="site-footer">

        </div>
    </footer>
</body>
</html>
